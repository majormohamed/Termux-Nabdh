name: Nabdh CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nabdh
      NEXTAUTH_SECRET: ci-only-secret-change-me
      NEXTAUTH_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nabdh
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nabdh"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database schema
        run: npx prisma db push --skip-generate

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build

      - name: Upload Next.js build on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nabdh-build-debug
          path: |
            .next
            npm-debug.log*
          if-no-files-found: ignore
